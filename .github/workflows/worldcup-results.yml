name: Update World Cup 2026 Results

on:
  schedule:
    # Every 5 minutes (GitHub's minimum) during match windows (UTC)
    - cron: '*/5 11-23 11 6 *'    # June 11
    - cron: '*/5 0-4  12 6 *'
    - cron: '*/5 11-23 12-27 6 *' # June 12-27 group stage
    - cron: '*/5 0-4  13-28 6 *'
    - cron: '*/5 11-23 28-30 6 *' # June 28-30 R32
    - cron: '*/5 0-4  29-30 6 *'
    - cron: '*/5 11-23 1-19 7 *'  # July 1-19 knockouts + final
    - cron: '*/5 0-4  2-20 7 *'
  workflow_dispatch:

jobs:
  update-results:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch results from football-data.org
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error
          from datetime import datetime, timezone

          API_KEY = os.environ.get('FOOTBALL_DATA_API_KEY', '')
          RESULTS_PATH = 'data/results.json'

          try:
              with open(RESULTS_PATH) as f:
                  data = json.load(f)
          except FileNotFoundError:
              data = {'lastUpdated': '', 'matches': {}}

          if not API_KEY:
              print('No FOOTBALL_DATA_API_KEY secret set — skipping API call.')
              sys.exit(0)

          # Normalize football-data.org TLAs to our internal codes where they differ
          TLA_NORM = {
              'CDI': 'CIV',  # Ivory Coast
              'SAU': 'KSA',  # Saudi Arabia
              'DRC': 'COD',  # DR Congo
              'BOS': 'BIH',  # Bosnia & Herzegovina
              'CUR': 'CUW',  # Curaçao
              'SKO': 'KOR',  # South Korea
              'URY': 'URU',  # Uruguay (API uses URY)
              'CPV': 'CPV',  # Cape Verde (already correct)
          }

          # Maps (date, tla) -> (internal_id, team1_tla)
          # Covers BOTH teams for every group match so home/away order in the
          # API doesn't matter. team1_tla lets us put scores in the right slots.
          TEAM_DATE_LOOKUP = {
              # Group A: MEX, RSA, KOR, CZE
              ('2026-06-11', 'MEX'): ('GA-MD1a', 'MEX'), ('2026-06-11', 'RSA'): ('GA-MD1a', 'MEX'),
              ('2026-06-12', 'KOR'): ('GA-MD1b', 'KOR'), ('2026-06-12', 'CZE'): ('GA-MD1b', 'KOR'),
              ('2026-06-19', 'MEX'): ('GA-MD2a', 'MEX'), ('2026-06-19', 'KOR'): ('GA-MD2a', 'MEX'),
              ('2026-06-18', 'CZE'): ('GA-MD2b', 'CZE'), ('2026-06-18', 'RSA'): ('GA-MD2b', 'CZE'),
              ('2026-06-25', 'MEX'): ('GA-MD3a', 'MEX'), ('2026-06-25', 'CZE'): ('GA-MD3a', 'MEX'),
              ('2026-06-25', 'KOR'): ('GA-MD3b', 'KOR'), ('2026-06-25', 'RSA'): ('GA-MD3b', 'KOR'),
              # Group B: CAN, BIH, QAT, SUI
              ('2026-06-12', 'CAN'): ('GB-MD1a', 'CAN'), ('2026-06-12', 'BIH'): ('GB-MD1a', 'CAN'),
              ('2026-06-13', 'QAT'): ('GB-MD1b', 'QAT'), ('2026-06-13', 'SUI'): ('GB-MD1b', 'QAT'),
              ('2026-06-18', 'CAN'): ('GB-MD2a', 'CAN'), ('2026-06-18', 'QAT'): ('GB-MD2a', 'CAN'),
              ('2026-06-18', 'BIH'): ('GB-MD2b', 'BIH'), ('2026-06-18', 'SUI'): ('GB-MD2b', 'BIH'),
              ('2026-06-24', 'CAN'): ('GB-MD3a', 'CAN'), ('2026-06-24', 'SUI'): ('GB-MD3a', 'CAN'),
              ('2026-06-24', 'BIH'): ('GB-MD3b', 'BIH'), ('2026-06-24', 'QAT'): ('GB-MD3b', 'BIH'),
              # Group C: BRA, MAR, HAI, SCO
              ('2026-06-13', 'BRA'): ('GC-MD1a', 'BRA'), ('2026-06-13', 'MAR'): ('GC-MD1a', 'BRA'),
              ('2026-06-14', 'HAI'): ('GC-MD1b', 'HAI'), ('2026-06-14', 'SCO'): ('GC-MD1b', 'HAI'),
              ('2026-06-20', 'BRA'): ('GC-MD2a', 'BRA'), ('2026-06-20', 'HAI'): ('GC-MD2a', 'BRA'),
              ('2026-06-19', 'MAR'): ('GC-MD2b', 'MAR'), ('2026-06-19', 'SCO'): ('GC-MD2b', 'MAR'),
              ('2026-06-24', 'BRA'): ('GC-MD3a', 'BRA'), ('2026-06-24', 'SCO'): ('GC-MD3a', 'BRA'),
              ('2026-06-24', 'MAR'): ('GC-MD3b', 'MAR'), ('2026-06-24', 'HAI'): ('GC-MD3b', 'MAR'),
              # Group D: USA, PAR, AUS, TUR
              ('2026-06-13', 'USA'): ('GD-MD1a', 'USA'), ('2026-06-13', 'PAR'): ('GD-MD1a', 'USA'),
              ('2026-06-14', 'AUS'): ('GD-MD1b', 'AUS'), ('2026-06-14', 'TUR'): ('GD-MD1b', 'AUS'),
              ('2026-06-19', 'USA'): ('GD-MD2a', 'USA'), ('2026-06-19', 'AUS'): ('GD-MD2a', 'USA'),
              ('2026-06-20', 'PAR'): ('GD-MD2b', 'PAR'), ('2026-06-20', 'TUR'): ('GD-MD2b', 'PAR'),
              ('2026-06-26', 'USA'): ('GD-MD3a', 'USA'), ('2026-06-26', 'TUR'): ('GD-MD3a', 'USA'),
              ('2026-06-26', 'PAR'): ('GD-MD3b', 'PAR'), ('2026-06-26', 'AUS'): ('GD-MD3b', 'PAR'),
              # Group E: GER, CUW, CIV, ECU
              ('2026-06-14', 'GER'): ('GE-MD1a', 'GER'), ('2026-06-14', 'CUW'): ('GE-MD1a', 'GER'),
              ('2026-06-14', 'CIV'): ('GE-MD1b', 'CIV'), ('2026-06-14', 'ECU'): ('GE-MD1b', 'CIV'),
              ('2026-06-20', 'GER'): ('GE-MD2a', 'GER'), ('2026-06-20', 'CIV'): ('GE-MD2a', 'GER'),
              ('2026-06-21', 'ECU'): ('GE-MD2b', 'ECU'), ('2026-06-21', 'CUW'): ('GE-MD2b', 'ECU'),
              ('2026-06-25', 'GER'): ('GE-MD3a', 'GER'), ('2026-06-25', 'ECU'): ('GE-MD3a', 'GER'),
              ('2026-06-25', 'CUW'): ('GE-MD3b', 'CUW'), ('2026-06-25', 'CIV'): ('GE-MD3b', 'CUW'),
              # Group F: NED, JPN, SWE, TUN
              ('2026-06-14', 'NED'): ('GF-MD1a', 'NED'), ('2026-06-14', 'JPN'): ('GF-MD1a', 'NED'),
              ('2026-06-15', 'SWE'): ('GF-MD1b', 'SWE'), ('2026-06-15', 'TUN'): ('GF-MD1b', 'SWE'),
              ('2026-06-20', 'NED'): ('GF-MD2a', 'NED'), ('2026-06-20', 'SWE'): ('GF-MD2a', 'NED'),
              ('2026-06-21', 'JPN'): ('GF-MD2b', 'JPN'), ('2026-06-21', 'TUN'): ('GF-MD2b', 'JPN'),
              ('2026-06-25', 'NED'): ('GF-MD3a', 'NED'), ('2026-06-25', 'TUN'): ('GF-MD3a', 'NED'),
              ('2026-06-25', 'JPN'): ('GF-MD3b', 'JPN'), ('2026-06-25', 'SWE'): ('GF-MD3b', 'JPN'),
              # Group G: BEL, EGY, IRN, NZL
              ('2026-06-15', 'BEL'): ('GG-MD1a', 'BEL'), ('2026-06-15', 'EGY'): ('GG-MD1a', 'BEL'),
              ('2026-06-16', 'IRN'): ('GG-MD1b', 'IRN'), ('2026-06-16', 'NZL'): ('GG-MD1b', 'IRN'),
              ('2026-06-21', 'BEL'): ('GG-MD2a', 'BEL'), ('2026-06-21', 'IRN'): ('GG-MD2a', 'BEL'),
              ('2026-06-22', 'EGY'): ('GG-MD2b', 'EGY'), ('2026-06-22', 'NZL'): ('GG-MD2b', 'EGY'),
              ('2026-06-27', 'BEL'): ('GG-MD3a', 'BEL'), ('2026-06-27', 'NZL'): ('GG-MD3a', 'BEL'),
              ('2026-06-27', 'EGY'): ('GG-MD3b', 'EGY'), ('2026-06-27', 'IRN'): ('GG-MD3b', 'EGY'),
              # Group H: ESP, CPV, KSA, URU
              ('2026-06-15', 'ESP'): ('GH-MD1a', 'ESP'), ('2026-06-15', 'CPV'): ('GH-MD1a', 'ESP'),
              ('2026-06-15', 'KSA'): ('GH-MD1b', 'KSA'), ('2026-06-15', 'URU'): ('GH-MD1b', 'KSA'),
              ('2026-06-21', 'ESP'): ('GH-MD2a', 'ESP'), ('2026-06-21', 'KSA'): ('GH-MD2a', 'ESP'),
              ('2026-06-21', 'CPV'): ('GH-MD2b', 'CPV'), ('2026-06-21', 'URU'): ('GH-MD2b', 'CPV'),
              ('2026-06-27', 'ESP'): ('GH-MD3a', 'ESP'), ('2026-06-27', 'URU'): ('GH-MD3a', 'ESP'),
              ('2026-06-27', 'CPV'): ('GH-MD3b', 'CPV'), ('2026-06-27', 'KSA'): ('GH-MD3b', 'CPV'),
              # Group I: FRA, SEN, IRQ, NOR
              ('2026-06-16', 'FRA'): ('GI-MD1a', 'FRA'), ('2026-06-16', 'SEN'): ('GI-MD1a', 'FRA'),
              ('2026-06-16', 'IRQ'): ('GI-MD1b', 'IRQ'), ('2026-06-16', 'NOR'): ('GI-MD1b', 'IRQ'),
              ('2026-06-22', 'FRA'): ('GI-MD2a', 'FRA'), ('2026-06-22', 'IRQ'): ('GI-MD2a', 'FRA'),
              ('2026-06-23', 'SEN'): ('GI-MD2b', 'SEN'), ('2026-06-23', 'NOR'): ('GI-MD2b', 'SEN'),
              ('2026-06-26', 'FRA'): ('GI-MD3a', 'FRA'), ('2026-06-26', 'NOR'): ('GI-MD3a', 'FRA'),
              ('2026-06-26', 'SEN'): ('GI-MD3b', 'SEN'), ('2026-06-26', 'IRQ'): ('GI-MD3b', 'SEN'),
              # Group J: ARG, ALG, AUT, JOR
              ('2026-06-17', 'ARG'): ('GJ-MD1a', 'ARG'), ('2026-06-17', 'ALG'): ('GJ-MD1a', 'ARG'),
              ('2026-06-17', 'AUT'): ('GJ-MD1b', 'AUT'), ('2026-06-17', 'JOR'): ('GJ-MD1b', 'AUT'),
              ('2026-06-22', 'ARG'): ('GJ-MD2a', 'ARG'), ('2026-06-22', 'AUT'): ('GJ-MD2a', 'ARG'),
              ('2026-06-23', 'ALG'): ('GJ-MD2b', 'ALG'), ('2026-06-23', 'JOR'): ('GJ-MD2b', 'ALG'),
              ('2026-06-28', 'ARG'): ('GJ-MD3a', 'ARG'), ('2026-06-28', 'JOR'): ('GJ-MD3a', 'ARG'),
              ('2026-06-28', 'ALG'): ('GJ-MD3b', 'ALG'), ('2026-06-28', 'AUT'): ('GJ-MD3b', 'ALG'),
              # Group K: POR, COD, UZB, COL
              ('2026-06-17', 'POR'): ('GK-MD1a', 'POR'), ('2026-06-17', 'COD'): ('GK-MD1a', 'POR'),
              ('2026-06-18', 'UZB'): ('GK-MD1b', 'UZB'), ('2026-06-18', 'COL'): ('GK-MD1b', 'UZB'),
              ('2026-06-23', 'POR'): ('GK-MD2a', 'POR'), ('2026-06-23', 'UZB'): ('GK-MD2a', 'POR'),
              ('2026-06-24', 'COD'): ('GK-MD2b', 'COD'), ('2026-06-24', 'COL'): ('GK-MD2b', 'COD'),
              ('2026-06-27', 'POR'): ('GK-MD3a', 'POR'), ('2026-06-27', 'COL'): ('GK-MD3a', 'POR'),
              ('2026-06-27', 'COD'): ('GK-MD3b', 'COD'), ('2026-06-27', 'UZB'): ('GK-MD3b', 'COD'),
              # Group L: ENG, CRO, GHA, PAN
              ('2026-06-17', 'ENG'): ('GL-MD1a', 'ENG'), ('2026-06-17', 'CRO'): ('GL-MD1a', 'ENG'),
              ('2026-06-17', 'GHA'): ('GL-MD1b', 'GHA'), ('2026-06-17', 'PAN'): ('GL-MD1b', 'GHA'),
              ('2026-06-23', 'ENG'): ('GL-MD2a', 'ENG'), ('2026-06-23', 'GHA'): ('GL-MD2a', 'ENG'),
              ('2026-06-23', 'CRO'): ('GL-MD2b', 'CRO'), ('2026-06-23', 'PAN'): ('GL-MD2b', 'CRO'),
              ('2026-06-27', 'ENG'): ('GL-MD3a', 'ENG'), ('2026-06-27', 'PAN'): ('GL-MD3a', 'ENG'),
              ('2026-06-27', 'CRO'): ('GL-MD3b', 'CRO'), ('2026-06-27', 'GHA'): ('GL-MD3b', 'CRO'),
          }

          # Knockout matches: (date, utc_time) -> internal_id
          KO_LOOKUP = {
              ('2026-06-28', '19:00'): 'M73',
              ('2026-06-29', '20:30'): 'M74',
              ('2026-06-30', '01:00'): 'M75',
              ('2026-06-29', '17:00'): 'M76',
              ('2026-06-30', '21:00'): 'M77',
              ('2026-06-30', '17:00'): 'M78',
              ('2026-07-01', '01:00'): 'M79',
              ('2026-07-01', '16:00'): 'M80',
              ('2026-07-02', '00:00'): 'M81',
              ('2026-07-01', '20:00'): 'M82',
              ('2026-07-02', '23:00'): 'M83',
              ('2026-07-02', '19:00'): 'M84',
              ('2026-07-03', '03:00'): 'M85',
              ('2026-07-03', '22:00'): 'M86',
              ('2026-07-04', '01:30'): 'M87',
              ('2026-07-03', '18:00'): 'M88',
              ('2026-07-04', '21:00'): 'M89',
              ('2026-07-04', '17:00'): 'M90',
              ('2026-07-05', '20:00'): 'M91',
              ('2026-07-06', '00:00'): 'M92',
              ('2026-07-06', '19:00'): 'M93',
              ('2026-07-07', '00:00'): 'M94',
              ('2026-07-07', '16:00'): 'M95',
              ('2026-07-07', '20:00'): 'M96',
              ('2026-07-09', '20:00'): 'M97',
              ('2026-07-10', '19:00'): 'M98',
              ('2026-07-11', '21:00'): 'M99',
              ('2026-07-12', '01:00'): 'M100',
              ('2026-07-14', '19:00'): 'M101',
              ('2026-07-15', '19:00'): 'M102',
              ('2026-07-18', '21:00'): 'M103',
              ('2026-07-19', '19:00'): 'M104',
          }

          STATUS_MAP = {
              'SCHEDULED': 'upcoming',
              'TIMED':     'upcoming',
              'IN_PLAY':   'live',
              'PAUSED':    'live',
              'FINISHED':  'finished',
              'AWARDED':   'finished',
              'CANCELLED': 'cancelled',
              'POSTPONED': 'upcoming',
          }

          url = 'https://api.football-data.org/v4/competitions/WC/matches'
          req = urllib.request.Request(url, headers={'X-Auth-Token': API_KEY})

          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  api_data = json.loads(resp.read())
          except urllib.error.URLError as e:
              print(f'API fetch failed: {e}')
              sys.exit(1)

          updated = False
          unmatched = []

          for m in api_data.get('matches', []):
              utc_date_str = m.get('utcDate', '')
              try:
                  dt = datetime.fromisoformat(utc_date_str.replace('Z', '+00:00'))
                  date_key = dt.strftime('%Y-%m-%d')
                  time_key = dt.strftime('%H:%M')
              except Exception:
                  continue

              home_tla_raw = m.get('homeTeam', {}).get('tla', '') or ''
              away_tla_raw = m.get('awayTeam', {}).get('tla', '') or ''
              home_tla = TLA_NORM.get(home_tla_raw.upper(), home_tla_raw.upper())
              away_tla = TLA_NORM.get(away_tla_raw.upper(), away_tla_raw.upper())

              # Try group lookup by either team on that date (order-independent)
              group_result = (TEAM_DATE_LOOKUP.get((date_key, home_tla))
                              or TEAM_DATE_LOOKUP.get((date_key, away_tla)))

              if group_result:
                  internal_id, team1_tla = group_result
              else:
                  internal_id = KO_LOOKUP.get((date_key, time_key))
                  team1_tla = home_tla  # for KO matches, assume home = team1

              if not internal_id:
                  unmatched.append(f'{date_key} {time_key} home={home_tla_raw} away={away_tla_raw}')
                  continue

              status = STATUS_MAP.get(m.get('status', ''), 'upcoming')
              score = m.get('score', {})
              full = score.get('fullTime', {})
              s_home = full.get('home')
              s_away = full.get('away')

              # Ensure score1 always belongs to team1, score2 to team2
              if home_tla == team1_tla:
                  s1, s2 = s_home, s_away
              else:
                  s1, s2 = s_away, s_home

              entry = data['matches'].get(internal_id, {})
              new_entry = {'score1': s1, 'score2': s2, 'status': status}

              if entry != new_entry:
                  data['matches'][internal_id] = new_entry
                  updated = True

          if unmatched:
              print(f'Warning: {len(unmatched)} unmatched API matches: {unmatched[:5]}')

          if updated:
              data['lastUpdated'] = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
              with open(RESULTS_PATH, 'w') as f:
                  json.dump(data, f, indent=2)
              print(f'Results updated: {RESULTS_PATH}')
          else:
              print('No changes to results.')
          PYEOF

      - name: Fetch top scorers from football-data.org
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error
          from datetime import datetime, timezone

          API_KEY = os.environ.get('FOOTBALL_DATA_API_KEY', '')
          SCORERS_PATH = 'data/scorers.json'

          if not API_KEY:
              print('No FOOTBALL_DATA_API_KEY secret set — skipping scorers.')
              sys.exit(0)

          try:
              with open(SCORERS_PATH) as f:
                  existing = json.load(f)
          except FileNotFoundError:
              existing = {'lastUpdated': '', 'scorers': []}

          TLA_NORM = {
              'CDI': 'CIV', 'SAU': 'KSA', 'DRC': 'COD',
              'BOS': 'BIH', 'CUR': 'CUW', 'SKO': 'KOR', 'URY': 'URU',
          }

          url = 'https://api.football-data.org/v4/competitions/WC/scorers'
          req = urllib.request.Request(url, headers={'X-Auth-Token': API_KEY})

          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  api_data = json.loads(resp.read())
          except urllib.error.URLError as e:
              print(f'Scorers API fetch failed: {e}')
              sys.exit(0)

          scorers = []
          for s in api_data.get('scorers', []):
              player = s.get('player', {})
              team   = s.get('team', {})
              tla_raw = (team.get('tla') or '').upper()
              tla = TLA_NORM.get(tla_raw, tla_raw)
              scorers.append({
                  'player':        player.get('name', ''),
                  'nationality':   player.get('nationality', ''),
                  'team':          team.get('name', ''),
                  'teamTla':       tla,
                  'playedMatches': s.get('playedMatches') or 0,
                  'goals':         s.get('goals') or 0,
                  'assists':       s.get('assists') or 0,
                  'penalties':     s.get('penalties') or 0,
              })

          if existing.get('scorers') != scorers:
              new_data = {
                  'lastUpdated': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
                  'scorers': scorers,
              }
              with open(SCORERS_PATH, 'w') as f:
                  json.dump(new_data, f, indent=2)
              print(f'Scorers updated: {len(scorers)} players')
          else:
              print('No changes to scorers.')
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results.json data/scorers.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: update World Cup 2026 results"
            git push origin main
          fi
