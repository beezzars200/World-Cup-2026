name: Update World Cup 2026 Results

on:
  schedule:
    # Every 5 minutes (GitHub's minimum) during match windows (UTC)
    - cron: '*/5 11-23 11 6 *'    # June 11
    - cron: '*/5 0-4  12 6 *'
    - cron: '*/5 11-23 12-27 6 *' # June 12-27 group stage
    - cron: '*/5 0-4  13-28 6 *'
    - cron: '*/5 11-23 28-30 6 *' # June 28-30 R32
    - cron: '*/5 0-4  29-30 6 *'
    - cron: '*/5 11-23 1-19 7 *'  # July 1-19 knockouts + final
    - cron: '*/5 0-4  2-20 7 *'
  workflow_dispatch:

# Runs poll for up to ~5 min, so prevent overlapping runs racing on git push
concurrency:
  group: results-update
  cancel-in-progress: false

jobs:
  update-results:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch results from ESPN
        run: |
          python3 - <<'PYEOF'
          import json, sys, time, urllib.request, urllib.error
          from datetime import datetime, timezone, timedelta

          RESULTS_PATH = 'data/results.json'

          try:
              with open(RESULTS_PATH) as f:
                  data = json.load(f)
          except FileNotFoundError:
              data = {'lastUpdated': '', 'matches': {}}

          # ESPN abbreviations → our internal TLAs
          ESPN_NORM = {
              'SKO': 'KOR',  # South Korea
              'BOS': 'BIH',  # Bosnia & Herzegovina
              'DRC': 'COD',  # DR Congo
              'CUR': 'CUW',  # Curaçao
              'SAU': 'KSA',  # Saudi Arabia
              'KSA': 'KSA',  # Saudi Arabia (in case ESPN uses KSA directly)
              'URY': 'URU',  # Uruguay
              'CDI': 'CIV',  # Ivory Coast
          }

          # Maps (date, our_tla) -> (internal_id, team1_tla)
          # Covers BOTH teams for every group match.
          TEAM_DATE_LOOKUP = {
              # Group A: MEX, RSA, KOR, CZE
              ('2026-06-11', 'MEX'): ('GA-MD1a', 'MEX'), ('2026-06-11', 'RSA'): ('GA-MD1a', 'MEX'),
              ('2026-06-12', 'KOR'): ('GA-MD1b', 'KOR'), ('2026-06-12', 'CZE'): ('GA-MD1b', 'KOR'),
              ('2026-06-19', 'MEX'): ('GA-MD2a', 'MEX'), ('2026-06-19', 'KOR'): ('GA-MD2a', 'MEX'),
              ('2026-06-18', 'CZE'): ('GA-MD2b', 'CZE'), ('2026-06-18', 'RSA'): ('GA-MD2b', 'CZE'),
              ('2026-06-25', 'MEX'): ('GA-MD3a', 'MEX'), ('2026-06-25', 'CZE'): ('GA-MD3a', 'MEX'),
              ('2026-06-25', 'KOR'): ('GA-MD3b', 'KOR'), ('2026-06-25', 'RSA'): ('GA-MD3b', 'KOR'),
              # Group B: CAN, BIH, QAT, SUI
              ('2026-06-12', 'CAN'): ('GB-MD1a', 'CAN'), ('2026-06-12', 'BIH'): ('GB-MD1a', 'CAN'),
              ('2026-06-13', 'QAT'): ('GB-MD1b', 'QAT'), ('2026-06-13', 'SUI'): ('GB-MD1b', 'QAT'),
              ('2026-06-18', 'CAN'): ('GB-MD2a', 'CAN'), ('2026-06-18', 'QAT'): ('GB-MD2a', 'CAN'),
              ('2026-06-18', 'BIH'): ('GB-MD2b', 'BIH'), ('2026-06-18', 'SUI'): ('GB-MD2b', 'BIH'),
              ('2026-06-24', 'CAN'): ('GB-MD3a', 'CAN'), ('2026-06-24', 'SUI'): ('GB-MD3a', 'CAN'),
              ('2026-06-24', 'BIH'): ('GB-MD3b', 'BIH'), ('2026-06-24', 'QAT'): ('GB-MD3b', 'BIH'),
              # Group C: BRA, MAR, HAI, SCO
              ('2026-06-13', 'BRA'): ('GC-MD1a', 'BRA'), ('2026-06-13', 'MAR'): ('GC-MD1a', 'BRA'),
              ('2026-06-14', 'HAI'): ('GC-MD1b', 'HAI'), ('2026-06-14', 'SCO'): ('GC-MD1b', 'HAI'),
              ('2026-06-20', 'BRA'): ('GC-MD2a', 'BRA'), ('2026-06-20', 'HAI'): ('GC-MD2a', 'BRA'),
              ('2026-06-19', 'MAR'): ('GC-MD2b', 'MAR'), ('2026-06-19', 'SCO'): ('GC-MD2b', 'MAR'),
              ('2026-06-24', 'BRA'): ('GC-MD3a', 'BRA'), ('2026-06-24', 'SCO'): ('GC-MD3a', 'BRA'),
              ('2026-06-24', 'MAR'): ('GC-MD3b', 'MAR'), ('2026-06-24', 'HAI'): ('GC-MD3b', 'MAR'),
              # Group D: USA, PAR, AUS, TUR
              ('2026-06-13', 'USA'): ('GD-MD1a', 'USA'), ('2026-06-13', 'PAR'): ('GD-MD1a', 'USA'),
              ('2026-06-14', 'AUS'): ('GD-MD1b', 'AUS'), ('2026-06-14', 'TUR'): ('GD-MD1b', 'AUS'),
              ('2026-06-19', 'USA'): ('GD-MD2a', 'USA'), ('2026-06-19', 'AUS'): ('GD-MD2a', 'USA'),
              ('2026-06-20', 'PAR'): ('GD-MD2b', 'PAR'), ('2026-06-20', 'TUR'): ('GD-MD2b', 'PAR'),
              ('2026-06-26', 'USA'): ('GD-MD3a', 'USA'), ('2026-06-26', 'TUR'): ('GD-MD3a', 'USA'),
              ('2026-06-26', 'PAR'): ('GD-MD3b', 'PAR'), ('2026-06-26', 'AUS'): ('GD-MD3b', 'PAR'),
