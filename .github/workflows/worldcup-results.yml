              ('2026-06-14', 'CIV'): ('GE-MD1b', 'CIV'), ('2026-06-14', 'ECU'): ('GE-MD1b', 'CIV'),
              ('2026-06-20', 'GER'): ('GE-MD2a', 'GER'), ('2026-06-20', 'CIV'): ('GE-MD2a', 'GER'),
              ('2026-06-21', 'ECU'): ('GE-MD2b', 'ECU'), ('2026-06-21', 'CUW'): ('GE-MD2b', 'ECU'),
              ('2026-06-25', 'GER'): ('GE-MD3a', 'GER'), ('2026-06-25', 'ECU'): ('GE-MD3a', 'GER'),
              ('2026-06-25', 'CUW'): ('GE-MD3b', 'CUW'), ('2026-06-25', 'CIV'): ('GE-MD3b', 'CUW'),
              # Group F: NED, JPN, SWE, TUN
              ('2026-06-14', 'NED'): ('GF-MD1a', 'NED'), ('2026-06-14', 'JPN'): ('GF-MD1a', 'NED'),
              ('2026-06-15', 'SWE'): ('GF-MD1b', 'SWE'), ('2026-06-15', 'TUN'): ('GF-MD1b', 'SWE'),
              ('2026-06-20', 'NED'): ('GF-MD2a', 'NED'), ('2026-06-20', 'SWE'): ('GF-MD2a', 'NED'),
              ('2026-06-21', 'JPN'): ('GF-MD2b', 'JPN'), ('2026-06-21', 'TUN'): ('GF-MD2b', 'JPN'),
              ('2026-06-25', 'NED'): ('GF-MD3a', 'NED'), ('2026-06-25', 'TUN'): ('GF-MD3a', 'NED'),
              ('2026-06-25', 'JPN'): ('GF-MD3b', 'JPN'), ('2026-06-25', 'SWE'): ('GF-MD3b', 'JPN'),
              # Group G: BEL, EGY, IRN, NZL
              ('2026-06-15', 'BEL'): ('GG-MD1a', 'BEL'), ('2026-06-15', 'EGY'): ('GG-MD1a', 'BEL'),
              ('2026-06-16', 'IRN'): ('GG-MD1b', 'IRN'), ('2026-06-16', 'NZL'): ('GG-MD1b', 'IRN'),
              ('2026-06-21', 'BEL'): ('GG-MD2a', 'BEL'), ('2026-06-21', 'IRN'): ('GG-MD2a', 'BEL'),
              ('2026-06-22', 'EGY'): ('GG-MD2b', 'EGY'), ('2026-06-22', 'NZL'): ('GG-MD2b', 'EGY'),
              ('2026-06-27', 'BEL'): ('GG-MD3a', 'BEL'), ('2026-06-27', 'NZL'): ('GG-MD3a', 'BEL'),
              ('2026-06-27', 'EGY'): ('GG-MD3b', 'EGY'), ('2026-06-27', 'IRN'): ('GG-MD3b', 'EGY'),
              # Group H: ESP, CPV, KSA, URU
              ('2026-06-15', 'ESP'): ('GH-MD1a', 'ESP'), ('2026-06-15', 'CPV'): ('GH-MD1a', 'ESP'),
              ('2026-06-15', 'KSA'): ('GH-MD1b', 'KSA'), ('2026-06-15', 'URU'): ('GH-MD1b', 'KSA'),
              ('2026-06-21', 'ESP'): ('GH-MD2a', 'ESP'), ('2026-06-21', 'KSA'): ('GH-MD2a', 'ESP'),
              ('2026-06-21', 'CPV'): ('GH-MD2b', 'CPV'), ('2026-06-21', 'URU'): ('GH-MD2b', 'CPV'),
              ('2026-06-27', 'ESP'): ('GH-MD3a', 'ESP'), ('2026-06-27', 'URU'): ('GH-MD3a', 'ESP'),
              ('2026-06-27', 'CPV'): ('GH-MD3b', 'CPV'), ('2026-06-27', 'KSA'): ('GH-MD3b', 'CPV'),
              # Group I: FRA, SEN, IRQ, NOR
              ('2026-06-16', 'FRA'): ('GI-MD1a', 'FRA'), ('2026-06-16', 'SEN'): ('GI-MD1a', 'FRA'),
              ('2026-06-16', 'IRQ'): ('GI-MD1b', 'IRQ'), ('2026-06-16', 'NOR'): ('GI-MD1b', 'IRQ'),
              ('2026-06-22', 'FRA'): ('GI-MD2a', 'FRA'), ('2026-06-22', 'IRQ'): ('GI-MD2a', 'FRA'),
              ('2026-06-23', 'SEN'): ('GI-MD2b', 'SEN'), ('2026-06-23', 'NOR'): ('GI-MD2b', 'SEN'),
              ('2026-06-26', 'FRA'): ('GI-MD3a', 'FRA'), ('2026-06-26', 'NOR'): ('GI-MD3a', 'FRA'),
              ('2026-06-26', 'SEN'): ('GI-MD3b', 'SEN'), ('2026-06-26', 'IRQ'): ('GI-MD3b', 'SEN'),
              # Group J: ARG, ALG, AUT, JOR
              ('2026-06-17', 'ARG'): ('GJ-MD1a', 'ARG'), ('2026-06-17', 'ALG'): ('GJ-MD1a', 'ARG'),
              ('2026-06-17', 'AUT'): ('GJ-MD1b', 'AUT'), ('2026-06-17', 'JOR'): ('GJ-MD1b', 'AUT'),
              ('2026-06-22', 'ARG'): ('GJ-MD2a', 'ARG'), ('2026-06-22', 'AUT'): ('GJ-MD2a', 'ARG'),
              ('2026-06-23', 'ALG'): ('GJ-MD2b', 'ALG'), ('2026-06-23', 'JOR'): ('GJ-MD2b', 'ALG'),
              ('2026-06-28', 'ARG'): ('GJ-MD3a', 'ARG'), ('2026-06-28', 'JOR'): ('GJ-MD3a', 'ARG'),
              ('2026-06-28', 'ALG'): ('GJ-MD3b', 'ALG'), ('2026-06-28', 'AUT'): ('GJ-MD3b', 'ALG'),
              # Group K: POR, COD, UZB, COL
              ('2026-06-17', 'POR'): ('GK-MD1a', 'POR'), ('2026-06-17', 'COD'): ('GK-MD1a', 'POR'),
              ('2026-06-18', 'UZB'): ('GK-MD1b', 'UZB'), ('2026-06-18', 'COL'): ('GK-MD1b', 'UZB'),
              ('2026-06-23', 'POR'): ('GK-MD2a', 'POR'), ('2026-06-23', 'UZB'): ('GK-MD2a', 'POR'),
              ('2026-06-24', 'COD'): ('GK-MD2b', 'COD'), ('2026-06-24', 'COL'): ('GK-MD2b', 'COD'),
              ('2026-06-27', 'POR'): ('GK-MD3a', 'POR'), ('2026-06-27', 'COL'): ('GK-MD3a', 'POR'),
              ('2026-06-27', 'COD'): ('GK-MD3b', 'COD'), ('2026-06-27', 'UZB'): ('GK-MD3b', 'COD'),
              # Group L: ENG, CRO, GHA, PAN
              ('2026-06-17', 'ENG'): ('GL-MD1a', 'ENG'), ('2026-06-17', 'CRO'): ('GL-MD1a', 'ENG'),
              ('2026-06-17', 'GHA'): ('GL-MD1b', 'GHA'), ('2026-06-17', 'PAN'): ('GL-MD1b', 'GHA'),
              ('2026-06-23', 'ENG'): ('GL-MD2a', 'ENG'), ('2026-06-23', 'GHA'): ('GL-MD2a', 'ENG'),
              ('2026-06-23', 'CRO'): ('GL-MD2b', 'CRO'), ('2026-06-23', 'PAN'): ('GL-MD2b', 'CRO'),
              ('2026-06-27', 'ENG'): ('GL-MD3a', 'ENG'), ('2026-06-27', 'PAN'): ('GL-MD3a', 'ENG'),
              ('2026-06-27', 'CRO'): ('GL-MD3b', 'CRO'), ('2026-06-27', 'GHA'): ('GL-MD3b', 'CRO'),
          }

          # Knockout matches: (date, utc_time HH:MM) -> internal_id
          KO_LOOKUP = {
              ('2026-06-28', '19:00'): 'M73',
              ('2026-06-29', '20:30'): 'M74',
              ('2026-06-30', '01:00'): 'M75',
              ('2026-06-29', '17:00'): 'M76',
              ('2026-06-30', '21:00'): 'M77',
              ('2026-06-30', '17:00'): 'M78',
              ('2026-07-01', '01:00'): 'M79',
              ('2026-07-01', '16:00'): 'M80',
              ('2026-07-02', '00:00'): 'M81',
              ('2026-07-01', '20:00'): 'M82',
              ('2026-07-02', '23:00'): 'M83',
              ('2026-07-02', '19:00'): 'M84',
              ('2026-07-03', '03:00'): 'M85',
              ('2026-07-03', '22:00'): 'M86',
              ('2026-07-04', '01:30'): 'M87',
              ('2026-07-03', '18:00'): 'M88',
              ('2026-07-04', '21:00'): 'M89',
              ('2026-07-04', '17:00'): 'M90',
              ('2026-07-05', '20:00'): 'M91',
              ('2026-07-06', '00:00'): 'M92',
              ('2026-07-06', '19:00'): 'M93',
              ('2026-07-07', '00:00'): 'M94',
              ('2026-07-07', '16:00'): 'M95',
              ('2026-07-07', '20:00'): 'M96',
              ('2026-07-09', '20:00'): 'M97',
              ('2026-07-10', '19:00'): 'M98',
              ('2026-07-11', '21:00'): 'M99',
              ('2026-07-12', '01:00'): 'M100',
              ('2026-07-14', '19:00'): 'M101',
              ('2026-07-15', '19:00'): 'M102',
              ('2026-07-18', '21:00'): 'M103',
              ('2026-07-19', '19:00'): 'M104',
          }

          def parse_score(s):
              try:
                  return int(s)
              except (TypeError, ValueError):
                  return None

          def poll_once(data):
              """One full ESPN sweep. Returns True if anything changed."""
              now_utc = datetime.now(timezone.utc)
              today_str = now_utc.strftime('%Y-%m-%d')
              # Query today + yesterday to catch late-night matches
              dates = [
                  (now_utc - timedelta(days=1)).strftime('%Y%m%d'),
                  now_utc.strftime('%Y%m%d'),
              ]

              updated = False
              unmatched = []

              for date_str in dates:
                  url = (
                      'https://site.api.espn.com/apis/site/v2/sports/soccer'
                      f'/fifa.world/scoreboard?dates={date_str}'
                  )
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                      with urllib.request.urlopen(req, timeout=15) as resp:
                          api_data = json.loads(resp.read())
                  except Exception as e:
                      print(f'ESPN fetch failed for {date_str}: {e}')
                      continue

                  events = api_data.get('events', [])

                  for event in events:
                      competitions = event.get('competitions', [])
                      if not competitions:
                          continue
                      comp = competitions[0]

                      # Parse event start date/time
                      event_dt_str = event.get('date', '')  # e.g. '2026-06-11T18:00Z'
                      event_date = event_dt_str[:10] if len(event_dt_str) >= 10 else ''
                      event_time = event_dt_str[11:16] if len(event_dt_str) >= 16 else ''

                      # ESPN's state field is authoritative: pre/in/post.
                      # Status *names* vary by phase (STATUS_FIRST_HALF,
                      # STATUS_HALFTIME, ...) so never key off them for live.
                      status_type = comp.get('status', {}).get('type', {})
                      status_name = status_type.get('name', '')
                      api_state = status_type.get('state', '')
                      if api_state == 'in':
                          our_status = 'live'
                      elif api_state == 'post':
                          if status_name in ('STATUS_CANCELED', 'STATUS_ABANDONED', 'STATUS_POSTPONED'):
                              our_status = 'cancelled'
                          else:
                              our_status = 'finished'
                      else:
                          our_status = 'upcoming'

                      competitors = comp.get('competitors', [])
                      home_c = next((c for c in competitors if c.get('homeAway') == 'home'), None)
                      away_c = next((c for c in competitors if c.get('homeAway') == 'away'), None)
                      if not home_c or not away_c:
                          continue

                      home_tla_raw = home_c.get('team', {}).get('abbreviation', '').upper()
                      away_tla_raw = away_c.get('team', {}).get('abbreviation', '').upper()
                      home_tla = ESPN_NORM.get(home_tla_raw, home_tla_raw)
                      away_tla = ESPN_NORM.get(away_tla_raw, away_tla_raw)

                      # ESPN reports "0" even for unplayed games — only trust
                      # scores once the match has actually started.
                      if our_status == 'upcoming' or our_status == 'cancelled':
                          home_score = None
                          away_score = None
                      else:
                          home_score = parse_score(home_c.get('score'))
                          away_score = parse_score(away_c.get('score'))

                      if event_date == today_str:
                          print(f'TODAY {home_tla_raw} vs {away_tla_raw} | state={api_state} name={status_name} | {home_score}-{away_score}')

                      # Look up by team + date (covers both home and away)
                      group_result = (TEAM_DATE_LOOKUP.get((event_date, home_tla))
                                      or TEAM_DATE_LOOKUP.get((event_date, away_tla)))

                      if group_result:
                          internal_id, team1_tla = group_result
                          if home_tla == team1_tla:
                              s1, s2 = home_score, away_score
                          else:
                              s1, s2 = away_score, home_score
                      else:
                          internal_id = KO_LOOKUP.get((event_date, event_time))
                          if internal_id:
                              s1, s2 = home_score, away_score
                          else:
                              unmatched.append(
                                  f'{event_date} {event_time} {home_tla_raw} vs {away_tla_raw}'
                              )
                              continue

                      new_entry = {'score1': s1, 'score2': s2, 'status': our_status}
                      if data['matches'].get(internal_id) != new_entry:
                          data['matches'][internal_id] = new_entry
                          updated = True

              if unmatched:
                  print(f'Unmatched events ({len(unmatched)}): {unmatched[:10]}')
              return updated

          # Poll every 30s for ~4.5 min (the cron fires every 5 min, so
          # consecutive runs cover the timeline continuously). Exit as soon
          # as a change is found so it gets committed + deployed immediately;
          # the next cron run picks up from there.
          ATTEMPTS = 9
          SLEEP_SECS = 30
          updated = False

          for attempt in range(ATTEMPTS):
              if attempt:
                  time.sleep(SLEEP_SECS)
              print(f'--- poll {attempt + 1}/{ATTEMPTS} ---')
              if poll_once(data):
                  updated = True
                  break

          if updated:
              data['lastUpdated'] = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
              with open(RESULTS_PATH, 'w') as f:
                  json.dump(data, f, indent=2)
              print('Results updated.')
          else:
              print('No changes to results.')
          PYEOF

      - name: Fetch top scorers from football-data.org
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error
          from datetime import datetime, timezone

          API_KEY = os.environ.get('FOOTBALL_DATA_API_KEY', '')
          SCORERS_PATH = 'data/scorers.json'

          if not API_KEY:
              print('No FOOTBALL_DATA_API_KEY secret set — skipping scorers.')
              sys.exit(0)

          try:
              with open(SCORERS_PATH) as f:
                  existing = json.load(f)
          except FileNotFoundError:
              existing = {'lastUpdated': '', 'scorers': []}

          TLA_NORM = {
              'CDI': 'CIV', 'SAU': 'KSA', 'DRC': 'COD',
              'BOS': 'BIH', 'CUR': 'CUW', 'SKO': 'KOR', 'URY': 'URU',
          }

          url = 'https://api.football-data.org/v4/competitions/WC/scorers'
          req = urllib.request.Request(url, headers={'X-Auth-Token': API_KEY})

          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  api_data = json.loads(resp.read())
          except urllib.error.URLError as e:
              print(f'Scorers API fetch failed: {e}')
              sys.exit(0)

          scorers = []
          for s in api_data.get('scorers', []):
              player = s.get('player', {})
              team   = s.get('team', {})
              tla_raw = (team.get('tla') or '').upper()
              tla = TLA_NORM.get(tla_raw, tla_raw)
              scorers.append({
                  'player':        player.get('name', ''),
                  'nationality':   player.get('nationality', ''),
                  'team':          team.get('name', ''),
                  'teamTla':       tla,
                  'playedMatches': s.get('playedMatches') or 0,
                  'goals':         s.get('goals') or 0,
                  'assists':       s.get('assists') or 0,
                  'penalties':     s.get('penalties') or 0,
              })

          if existing.get('scorers') != scorers:
              new_data = {
                  'lastUpdated': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
                  'scorers': scorers,
              }
              with open(SCORERS_PATH, 'w') as f:
                  json.dump(new_data, f, indent=2)
              print(f'Scorers updated: {len(scorers)} players')
          else:
              print('No changes to scorers.')
          PYEOF

      - name: Fetch disciplinary cards from ESPN
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, urllib.error
          from datetime import datetime, timezone, timedelta

          CARDS_PATH = 'data/cards.json'

          try:
              with open(CARDS_PATH) as f:
                  existing = json.load(f)
          except FileNotFoundError:
              existing = {'lastUpdated': '', 'cards': []}

          ESPN_NORM = {
              'SKO': 'KOR', 'BOS': 'BIH', 'DRC': 'COD', 'CUR': 'CUW',
              'SAU': 'KSA', 'URY': 'URU', 'CDI': 'CIV',
          }

          # Whole tournament to date in one range query
          end = (datetime.now(timezone.utc) + timedelta(days=1)).strftime('%Y%m%d')
          url = (
              'https://site.api.espn.com/apis/site/v2/sports/soccer'
              f'/fifa.world/scoreboard?dates=20260611-{end}'
          )

          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=20) as resp:
                  api_data = json.loads(resp.read())
          except Exception as e:
              print(f'ESPN cards fetch failed: {e}')
              import sys; sys.exit(0)

          players = {}

          for event in api_data.get('events', []):
              competitions = event.get('competitions', [])
              if not competitions:
                  continue
              comp = competitions[0]

              # team id -> (abbreviation, display name)
              team_by_id = {}
              for c in comp.get('competitors', []):
                  t = c.get('team', {})
                  tla_raw = (t.get('abbreviation') or '').upper()
                  team_by_id[str(t.get('id'))] = (
                      ESPN_NORM.get(tla_raw, tla_raw),
                      t.get('displayName', ''),
                  )

              # Per-match tally so a second yellow + red counts as one 🟨🟥
              match_tally = {}
              for d in comp.get('details', []):
                  is_red = d.get('redCard', False)
                  is_yellow = d.get('yellowCard', False)
                  if not is_red and not is_yellow:
                      continue
                  athletes = d.get('athletesInvolved', [])
                  if not athletes:
                      continue
                  name = athletes[0].get('displayName', '')
                  if not name:
                      continue
                  team_id = str(d.get('team', {}).get('id', ''))
                  tla, team_name = team_by_id.get(team_id, ('', ''))
                  key = name
                  if key not in match_tally:
                      match_tally[key] = {'y': 0, 'r': 0, 'tla': tla, 'team': team_name}
                  if is_red:
                      match_tally[key]['r'] += 1
                  else:
                      match_tally[key]['y'] += 1

              for name, t in match_tally.items():
                  if name not in players:
                      players[name] = {
                          'player': name, 'team': t['team'], 'teamTla': t['tla'],
                          'yellow': 0, 'yellowRed': 0, 'red': 0,
                      }
                  p = players[name]
                  if t['r'] >= 1 and t['y'] >= 2:
                      # Second yellow: one yellow stands, the rest is a 🟨🟥
                      p['yellowRed'] += 1
                      p['yellow'] += t['y'] - 1
                  else:
                      p['yellow'] += t['y']
                      p['red'] += t['r']

          cards = sorted(
              players.values(),
              key=lambda x: (-x['red'], -x['yellowRed'], -x['yellow'], x['player'])
          )
          print(f'Cards: {len(cards)} player(s) with bookings')

          if existing.get('cards') != cards:
              new_data = {
                  'lastUpdated': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
                  'cards': cards,
              }
              with open(CARDS_PATH, 'w') as f:
                  json.dump(new_data, f, indent=2)
              print('Cards updated.')
          else:
              print('No changes to cards.')
          PYEOF

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results.json data/scorers.json data/cards.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update World Cup 2026 results"
            git pull --rebase origin main
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Pushes made with GITHUB_TOKEN don't trigger the Pages workflow,
  # so deploy directly from here whenever data changed.
  deploy-pages:
    needs: update-results
    if: needs.update-results.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
